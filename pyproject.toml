[project]
name = "dual-clock-vlm-refusal"
version = "0.1.0"
description = "Mechanistic interpretability: dual-clock activation patching for VLM refusal in Qwen2.5-VL-7B-Instruct"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate",
    "qwen-vl-utils",
    "Pillow",
    "numpy",
    "scipy",
    "pandas",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
